baseURL = "https://londopy.github.io/blog/"
locale = "en-us"
title = "Londopy"
theme = "PaperMod"
enableRobotsTXT = true
copyright = "© 2026 Londopy · Posts [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/) · Code [MIT](https://github.com/Londopy/blog/blob/main/LICENSE)"

[taxonomies]
  tag = "tags"

[params]
  author = "Londopy"
  description = "Notes on security, systems, radio, and building things, plus whatever else I'm chewing on."
  defaultTheme = "auto"
  mainSections = ["posts"]
  ShowReadingTime = true
  ShowCodeCopyButtons = true
  ShowToc = true
  ShowPostNavLinks = true
  ShowShareButtons = false
  ShowRssButtonInSectionTermList = true
  # dev.to's "Publishing to DEV from RSS" imports whatever the feed carries,
  # so ship whole posts, not summaries.
  ShowFullTextinRSS = true
  # Social card for pages without a cover (scripts/make_cover.py --site).
  images = ["og-image.png"]

[params.label]
  icon = "favicon.svg"
  iconHeight = 28

[params.homeInfoParams]
  Title = "Londopy"
  Content = "Notes on security, systems, radio, and building things, plus whatever else I'm chewing on."

[[params.socialIcons]]
  name = "github"
  title = "GitHub"
  url = "https://github.com/Londopy"

[[params.socialIcons]]
  name = "email"
  title = "Contact"
  url = "https://londopy.github.io/blog/contact/"

[[params.socialIcons]]
  name = "rss"
  title = "RSS"
  url = "https://londopy.github.io/blog/index.xml"

# PaperMod links all five of these from <head>; the files live in static/
# and come from scripts/make_icons.py.
[params.assets]
  favicon = "favicon.ico"
  favicon16x16 = "favicon-16x16.png"
  favicon32x32 = "favicon-32x32.png"
  apple_touch_icon = "apple-touch-icon.png"
  safari_pinned_tab = "safari-pinned-tab.svg"

# pageRef (not url) so the links keep the /blog/ prefix.
[[menus.main]]
  name = "Archive"
  pageRef = "/archives"
  weight = 10

[[menus.main]]
  name = "Tags"
  pageRef = "/tags"
  weight = 20

[[menus.main]]
  identifier = "search"
  name = "Search"
  pageRef = "/search"
  weight = 30

[[menus.main]]
  name = "About"
  pageRef = "/about"
  weight = 40

[[menus.main]]
  name = "Contact"
  pageRef = "/contact"
  weight = 45

[[menus.main]]
  name = "Projects"
  url = "https://londopy.github.io/"
  weight = 50

[outputs]
  home = ["HTML", "RSS", "JSON"]    # JSON powers PaperMod search

# With noClasses = false the colors come from CSS, not from `style`:
# assets/css/includes/chroma-styles.css is `hugo gen chromastyles --style=monokai`.
[markup.highlight]
  noClasses = false
  style = "monokai"
