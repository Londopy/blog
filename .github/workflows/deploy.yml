name: Deploy Hugo site to Pages

on:
  push:
    branches: [main]
  # Daily rebuild: Hugo skips posts dated in the future, so this is what
  # publishes a scheduled post on its date. 17:30 UTC is 10:30 PDT / 09:30 PST,
  # so a post dated 09:00 Pacific goes up the same morning all year, and it
  # stays off the top of the hour, when GitHub's scheduler is busiest.
  schedule:
    - cron: "30 17 * * *"
  workflow_dispatch:
    inputs:
      email_post:
        description: "Also email subscribers about this post (its slug), if its email didn't go out. Leave empty to just deploy."
        type: string
        default: ""
      email_draft:
        description: "With a slug above: only make a draft in Buttondown to preview, and send nothing."
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      new_posts: ${{ steps.new_posts.outputs.new_posts }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive   # the theme is a submodule
          fetch-depth: 0
      # Third-party action: pinned to a commit, since tags can be moved.
      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78  # v3.2.1
        with:
          # Pinned so a new Hugo release can't break the build unannounced.
          # Bump it together with a local `hugo server` check.
          hugo-version: "0.166.0"
          extended: true
      - id: pages
        uses: actions/configure-pages@v6
      - run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      # Validates every API response against the OpenAPI description and checks
      # the API lists exactly the posts that were built. Fails the deploy if not.
      - name: Check the JSON API
        run: python3 scripts/check_api.py public
      # Which posts this deploy publishes: the ones in this build that the live
      # site doesn't list yet. The notify job emails them after the deploy.
      # Neither step can stop the deploy; if either fails, nobody gets emailed.
      - name: Test the notifier
        id: notifier
        continue-on-error: true
        run: python3 scripts/test_notify.py
      - name: Find posts to email
        id: new_posts
        if: steps.notifier.outcome == 'success'
        continue-on-error: true
        env:
          LIVE_POSTS: ${{ steps.pages.outputs.base_url }}/api/v1/posts.json
          EMAIL_POST: ${{ inputs.email_post }}
        run: python3 scripts/notify.py plan public
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Emails subscribers about the posts this deploy published, through
  # Buttondown (scripts/notify.py). Until the BUTTONDOWN_API_KEY secret
  # exists, it only notes which posts it would have emailed.
  notify:
    needs: [build, deploy]
    if: needs.build.outputs.new_posts != '' && needs.build.outputs.new_posts != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - name: Email subscribers
        env:
          NEW_POSTS: ${{ needs.build.outputs.new_posts }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          EMAIL_DRAFT: ${{ inputs.email_draft }}
        run: python3 scripts/notify.py send
