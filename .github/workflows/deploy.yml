name: Deploy Hugo site to Pages

on:
  push:
    branches: [main]
  # Daily rebuild: Hugo skips posts dated in the future, so this is what
  # publishes a scheduled post on its date. 17:30 UTC is 10:30 PDT / 09:30 PST,
  # so a post dated 09:00 Pacific goes up the same morning all year, and it
  # stays off the top of the hour, when GitHub's scheduler is busiest.
  schedule:
    - cron: "30 17 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive   # the theme is a submodule
          fetch-depth: 0
      # Third-party action: pinned to a commit, since tags can be moved.
      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78  # v3.2.1
        with:
          # Pinned so a new Hugo release can't break the build unannounced.
          # Bump it together with a local `hugo server` check.
          hugo-version: "0.166.0"
          extended: true
      - id: pages
        uses: actions/configure-pages@v6
      - run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      # Validates every API response against the OpenAPI description and checks
      # the API lists exactly the posts that were built. Fails the deploy if not.
      - name: Check the JSON API
        run: python3 scripts/check_api.py public
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
